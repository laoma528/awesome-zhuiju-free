name: Check public files

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  public-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Reject private files and credentials
        run: node scripts/check-public-files.mjs --ref HEAD
